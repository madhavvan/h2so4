<?xml version="1.0" encoding="UTF-8"?>
<!--
  Interview Copilot — "Given Word" master icon.
  1024x1024. One idea, drawn plainly (the Claude/Grok school):

  A closing quotation pair — the words you SAY. The leading drop is
  solid gold: the line the copilot hands you. The trailing drop is
  obsidian with a gold edge: the same words as you speak them — present,
  but visible only to you. Two voices, one quote. That is the product.

  Construction: flat, monumental, centered. One material accent (the
  molten-gold ramp on the lead drop) and nothing else — no stages, no
  props, no sparkles. Layers: #stage #drop-lead #drop-echo #rim.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="squircle"><rect width="1024" height="1024" rx="228" ry="228"/></clipPath>

    <radialGradient id="stageGrad" cx="34%" cy="20%" r="110%">
      <stop offset="0%" stop-color="#191521"/>
      <stop offset="45%" stop-color="#0e0c13"/>
      <stop offset="100%" stop-color="#040305"/>
    </radialGradient>
    <linearGradient id="stageShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- molten gold, lit from the top -->
    <linearGradient id="goldRamp" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#f9ecc0"/>
      <stop offset="38%" stop-color="#ecd28a"/>
      <stop offset="74%" stop-color="#d3ac63"/>
      <stop offset="100%" stop-color="#a17e3c"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d78a"/>
      <stop offset="100%" stop-color="#b08a44"/>
    </linearGradient>

    <linearGradient id="rimHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#d3ac63" stop-opacity="0.16"/>
    </linearGradient>

    <!-- One quote-drop: a full round head flowing into a tapered tail
         that sweeps down-left — the classic typographic comma, drawn
         heavy enough to survive 16px. Head r=132 centered (0,0); tail
         reaches y=+338. Re-used for both voices. -->
    <path id="drop" d="
      M 0 -132
      A 132 132 0 1 1 -1 -132
      Z
      M 118 60
      C 122 160 76 262 -34 338
      C 30 240 52 168 44 118
      C 66 100 96 84 118 60
      Z"/>
    <!-- Solid single-outline version (head + tail as one silhouette) -->
    <path id="dropSolid" d="
      M -132 0
      A 132 132 0 1 1 118 60
      C 122 160 76 262 -34 338
      C 30 240 52 168 44 118
      A 132 132 0 0 1 -132 0
      Z"/>
  </defs>

  <g clip-path="url(#squircle)">
    <g id="stage">
      <rect width="1024" height="1024" fill="url(#stageGrad)"/>
      <rect width="1024" height="560" fill="url(#stageShine)"/>
    </g>

    <!-- the pair sits optically centered, heads on one line -->
    <g id="drop-lead">
      <use href="#dropSolid" transform="translate(382,412)" fill="url(#goldRamp)"/>
      <!-- top specular: the only material flourish -->
      <path d="M 288.7 318.7 A 132 132 0 0 1 475.3 318.7"
            fill="none" stroke="#fff7dc" stroke-opacity="0.65" stroke-width="10" stroke-linecap="round"/>
    </g>

    <g id="drop-echo">
      <use href="#dropSolid" transform="translate(668,412)" fill="#2b2839"/>
      <use href="#dropSolid" transform="translate(668,412)" fill="none" stroke="url(#goldEdge)" stroke-width="7" stroke-opacity="0.85"/>
    </g>
  </g>

  <rect id="rim" x="1.5" y="1.5" width="1021" height="1021" rx="226.5" ry="226.5"
        fill="none" stroke="url(#rimHi)" stroke-width="3"/>
</svg>
