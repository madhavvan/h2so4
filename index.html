<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
         Content Security Policy
         Defense-in-depth on top of Electron's contextIsolation +
         nodeIntegration:false. Specifically blocks any markdown-injected
         <script src=evil> and any javascript: URL that would otherwise
         survive into the renderer. The directives are calibrated so:
           • Vite dev HMR works (unsafe-eval, ws:)
           • Packaged builds work (file:// + dist/ assets)
           • Outbound API + Deepgram WebSocket work
           • Inline <style> in this file works ('unsafe-inline' in style-src)
           • Inline scripts are NOT allowed — strict-dynamic isn't here yet
             but 'self' + no nonce blocks any injected script tag
         Google Sign-In (GSI) needs accounts.google.com in script-src,
         style-src, and frame-src for @react-oauth/google to work.
         Razorpay (India checkout) needs checkout.razorpay.com in
         script-src (SubscriptionGate injects its checkout.js on demand)
         and api.razorpay.com + checkout.razorpay.com in frame-src for
         the payment modal iframe — without these the SDK script is
         refused and every INR payment dies with "Failed to load
         Razorpay SDK" before the modal can open.
         ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-eval' https://accounts.google.com https://checkout.razorpay.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https:;
      media-src 'self' blob: data:;
      connect-src 'self' ws: wss: http://localhost:* https: data: blob:;
      frame-src https://accounts.google.com https://api.razorpay.com https://checkout.razorpay.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    ">
    <!-- Deliberately just the wordmark: document.title overrides the
         BrowserWindow title Electron sets in main.cjs, so whatever is
         here is also what the desktop app shows in the taskbar mid-
         interview. "minicaai" is brand-exact and says nothing about
         interviews to a shoulder-surfer; the marketing sentence lives
         in og:title / description below, which only crawlers read. -->
    <title>minicaai</title>
    <meta name="description" content="minicaai listens to your live interview call and streams a personalized answer to your screen — invisible to screen-share. Works with Zoom, Google Meet, and Microsoft Teams. Start free, no card." />
    <link rel="canonical" href="https://minicaai.com/" />
    <!-- Obsidian page ground — tints mobile browser chrome to match. -->
    <meta name="theme-color" content="#070706" />
    <!-- Social cards. og.png is a 1200×630 obsidian-and-gold render of
         the hero line, generated at scripts/og/og.html → public/og.png
         (headless-browser screenshot); regenerate there if the hero
         copy or brand palette ever changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="minicaai" />
    <meta property="og:title" content="Every interview question, answered the moment it’s asked." />
    <meta property="og:description" content="minicaai listens to your live call and streams a personalized answer to your screen — invisible to everyone but you. Zoom · Google Meet · Teams. Start free." />
    <meta property="og:url" content="https://minicaai.com/" />
    <meta property="og:image" content="https://minicaai.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="minicaai — every interview question, answered the moment it’s asked." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Every interview question, answered the moment it’s asked." />
    <meta name="twitter:description" content="minicaai listens to your live call and streams a personalized answer to your screen — invisible to everyone but you. Start free." />
    <meta name="twitter:image" content="https://minicaai.com/og.png" />
    <!-- Branded favicon set. Generated from build/icon.svg by
         scripts/build-icons.mjs and copied into the build root by Vite from
         public/. Order matters: browsers scan link[rel=icon] entries and
         pick the first supported one, so the higher-resolution PNG goes
         ahead of the ICO fallback. apple-touch-icon covers iOS home-screen
         "Add to Home Screen" and macOS Safari tab groups. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Anthropic-inspired display serif (Newsreader is the closest free
         Tiempos-alike on Google Fonts) + Inter for UI body. Preconnect for
         the font CDN so the first paint isn't blocked by the DNS round-trip;
         display=swap so we never block render on the font itself. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ital axis included: the landing's signature lines are true-italic
         serif (hero typed line, closing). Without the italic cuts the
         browser synthesizes a sheared roman — the classic cheap-type tell. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=Inter:wght@400;500;600;700&display=swap" />
    <!-- Tailwind compiled via PostCSS; loaded BEFORE the inline <style> so
         our custom iOS-token CSS below wins the cascade (matches the order
         Play CDN used to produce). Vite processes this through tailwind.config.cjs + postcss.config.cjs. -->
    <link rel="stylesheet" href="/index.css">
    <style>
      :root {
        /* Light Mode Defaults — now warm cream tokens, NOT pure white.
           User feedback 2026-05-13: "pure white look[s] pure white,
           make it look rich". Cream palette gives the in-app light
           theme an Anthropic-inspired warm feel instead of generic
           SaaS pure-white. */
        --bg-color: #faf6ec;            /* warm page bg */
        --surface-color: #faf7f0;       /* --cream — panel/modal surface */
        --border-color: #e8e2d1;        /* --cream-line — warm border */
        --text-color: #141413;          /* --ink — warm near-black */

        /* Theme-aware popover surfaces (model picker, dropdowns, tooltips).
           Default = light cream translucent. .dark overrides below set
           the dark navy used by the original popout-design popover. */
        --model-menu-bg:      rgba(250, 247, 240, 0.94);
        --model-menu-border:  rgba(20, 20, 19, 0.18);
        --model-menu-shadow:  0 10px 32px rgba(20, 20, 19, 0.18);

        /* ── Anthropic-inspired warm palette (landing + auth views) ──
           Used on the public marketing surface and the login/signup
           modals so visitors get the polished, restrained feel of
           anthropic.com / claude.ai instead of generic SaaS-dark.
           The in-app tool surface stays on the dark zinc tokens above
           for eye-comfort during long interview sessions. */
        --cream:        #faf7f0;
        --cream-soft:   #f3eee2;
        --cream-line:   #e8e2d1;
        --ink:          #141413;
        --ink-soft:     #2a2925;
        --ink-muted:    #6b6a64;
        --ink-faint:    #9b988e;
        --accent:       #c96342;  /* Anthropic terracotta */
        --accent-soft:  #f4ddd2;

        /* ── Minica support chat — LIGHT (warm cream + gold) ──
           Scoped to --mc-* on purpose. The support panel used to mix the
           app's neutral surface tokens with hardcoded cool greys
           (#6b7280 / #9ca3af) that never flipped with the theme, so it
           read as a different product sitting inside a warm app. These
           give it the same warm material as everything else WITHOUT
           touching --cream/--ink/--accent, which the landing and the
           auth views share globally — re-pointing those would re-skin
           surfaces this change has no business touching. */
        --mc-bg:          #f6f1e5;   /* panel ground */
        --mc-raise:       #fffdf8;   /* bubbles, elevated rows */
        --mc-input:       #fffdf8;
        --mc-line:        #e5dcc7;
        --mc-ink:         #141413;
        --mc-ink-soft:    #35332c;
        --mc-ink-muted:   #6b6a64;
        --mc-ink-faint:   #7d7869;   /* 3.91:1 on --mc-bg (was #9b988e, 2.56:1) */
        --mc-accent:      #8a6120;   /* gold, deepened for cream — 4.89:1 (AA) */
        --mc-accent-soft: rgba(138, 97, 32, 0.12);
        --mc-invert-bg:   #1a1710;   /* customer bubble: obsidian on cream */
        --mc-invert-ink:  #f7f3e9;
        --mc-ok:          #2a6f52;   /* agent-online — warm, 5.33:1 (AA) */
        --mc-warn:        #b0741f;
        --mc-danger:      #b0442f;
        --mc-glass:       rgba(250, 247, 240, 0.92);
        --mc-shadow:      0 18px 48px -24px rgba(20, 20, 19, 0.34),
                          0 2px 8px -4px rgba(20, 20, 19, 0.16);

        /* ── Obsidian & Gold (shared with the marketing landing) ──
           The premium landing (PremiumLanding.tsx) is built on warm
           obsidian + a single precious gold accent + Newsreader serif.
           These tokens bring that exact language into the in-app dark
           theme and the transparent pop-out so the logged-in tool
           feels like a continuation of the landing, not a different
           product. Defined globally (harmless in light mode); consumed
           by the `.dark` obsidian skin layer in index.css and by the
           pop-out overrides in pip-styles.css. Keep in sync with the
           `--gold*` values inside PremiumLanding.tsx's scoped CSS. */
        --paper:        #f2efe6;   /* warm off-white — the landing's text */
        --obsidian:     #0b0a08;   /* warm near-black page ground */
        --obsidian-2:   #15130d;   /* elevated warm surface */
        --gold-1:       #e6d29c;   /* bright highlight end of the gold (toned ~8% for less glare) */
        --gold-2:       #cba966;   /* mid gold */
        --gold-3:       #aa863f;   /* deep gold / shadow end */
        --gold:         #c39d58;   /* the single accent (toned down from #d3ac63 per brightness feedback) */
        --gold-line:    rgba(195, 157, 88, 0.20);  /* hairlines, borders (softer) */
        --gold-glow:    rgba(195, 157, 88, 0.12);  /* spotlights, focus (dimmer glow) */
        --gold-grad:    linear-gradient(100deg, #e6d29c, #cba966 55%, #aa863f);

        --serif: 'Newsreader', 'Tiempos Headline', 'Source Serif 4',
                 ui-serif, Georgia, serif;
        --sans:  'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 Roboto, Helvetica, Arial, sans-serif;

        /* ── iOS motion tokens ──
           These map to the feel of UIKit's standard spring curves.
           Use these everywhere instead of hard-coded `ease-*` so the
           whole app picks up the same cadence. */
        --ease-ios:       cubic-bezier(0.32, 0.72, 0, 1);   /* iOS spring-ish */
        --ease-ios-out:   cubic-bezier(0.16, 1,   0.3, 1);  /* snappy emphasis */
        --ease-ios-in:    cubic-bezier(0.55, 0,   0.85, 0); /* press / dismiss */
        --dur-ios-fast:   180ms;
        --dur-ios:        260ms;
        --dur-ios-slow:   420ms;

        /* ── Spring physics for the iOS-mobile landing experience ──
           cubic-bezier curves above are great for hover/press; springs are
           what makes "open/close" feel like an iOS app. Sampled from a
           damped harmonic oscillator (mass 1, stiffness 180, damping 18 →
           damping ratio ~0.67) — the canonical "lands with a tiny
           overshoot" feel. CSS linear() is supported in Chrome 113+,
           Safari 17.2+, Firefox 112+; older engines fall through to the
           cubic-bezier defaults via the @supports guard below. */
        --spring-summon:  linear(
          0, 0.026, 0.097, 0.211, 0.358, 0.524, 0.687, 0.825,
          0.923, 0.984, 1.018, 1.034, 1.038, 1.034, 1.026,
          1.018, 1.011, 1.005, 1.001, 1
        );
        --spring-dismiss: linear(
          0, 0.022, 0.082, 0.18, 0.31, 0.456, 0.6, 0.728, 0.83,
          0.906, 0.957, 0.985, 0.998, 1.003, 1.003, 1.001, 1
        );
        --dur-summon:  340ms;
        --dur-dismiss: 380ms;
      }
      /* Fallback for engines that don't support linear() — linear() resolves
         to a comma-separated list of stops; a non-supporting parser drops
         the value and the variable becomes empty. Provide a cubic-bezier
         tail that approximates the overshoot well enough for the rare
         visitor on a dated browser. */
      @supports not (transition-timing-function: linear(0, 1)) {
        :root {
          --spring-summon:  cubic-bezier(0.16, 1.18, 0.3, 1);
          --spring-dismiss: cubic-bezier(0.32, 0.72, 0, 1);
        }
      }

      .dark {
        /* Dark Mode Defaults — WARM OBSIDIAN (2026-07).
           Was cool Zinc (#09090b / #18181b / #27272a / #e4e4e7). Shifted
           to the landing's warm obsidian + paper so the logged-in tool
           shares the marketing surface's material. Kept a hair above pure
           black for long-session eye comfort. */
        --bg-color: #0b0a08;      /* warm obsidian ground (was zinc-950) */
        --surface-color: #15130d; /* warm elevated surface (was zinc-900) */
        --border-color: #221f17;  /* faint warm hairline — softer, less "boxed" */
        --text-color: #ece7dc;    /* warm paper text (was zinc-200) */

        /* Dark-mode popover surfaces — warm obsidian glass with a gold
           hairline (was deep navy + white border), so the model picker /
           dropdowns match the pop-out and landing. */
        --model-menu-bg:     rgba(16, 14, 10, 0.95);
        --model-menu-border: rgba(211, 172, 99, 0.28);
        --model-menu-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 26px 64px -22px rgba(0, 0, 0, 0.88), 0 2px 10px -4px rgba(0, 0, 0, 0.5);

        /* ── Minica support chat — DARK (obsidian + gold) ──
           Same material as the model picker above and the auth views:
           warm obsidian glass, a gold hairline instead of a grey box, and
           a layered shadow rather than a flat drop. The customer's own
           bubble inverts to gold — it is the one element that should read
           as "you", and gold on obsidian is the product's signature. */
        --mc-bg:          #100e0a;
        --mc-raise:       #17140e;
        --mc-input:       #14120d;
        --mc-line:        rgba(211, 172, 99, 0.16);
        --mc-ink:         #f2efe6;
        --mc-ink-soft:    #d9d3c6;
        --mc-ink-muted:   #9d968a;
        --mc-ink-faint:   #6a6355;
        --mc-accent:      #d3ac63;
        --mc-accent-soft: rgba(211, 172, 99, 0.14);
        --mc-invert-bg:   #d3ac63;   /* customer bubble: gold on obsidian */
        --mc-invert-ink:  #14120d;
        --mc-ok:          #6fcf9a;
        --mc-warn:        #e0a94a;
        --mc-danger:      #e8836b;
        --mc-glass:       rgba(16, 14, 10, 0.94);
        --mc-shadow:      inset 0 1px 0 rgba(255, 255, 255, 0.05),
                          0 26px 64px -22px rgba(0, 0, 0, 0.88),
                          0 2px 10px -4px rgba(0, 0, 0, 0.5);
      }

      /* ── Typography: SF-family, -webkit-font-smoothing for iOS feel ── */
      html, body, #root {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                     "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        letter-spacing: -0.01em;
      }

      /* ── Smooth, rubber-band-ish scrolling for any scrollable area ── */
      html {
        scroll-behavior: smooth;
      }
      body,
      #root,
      .overflow-auto,
      .overflow-y-auto,
      [data-scrollable] {
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }

      /* Custom Scrollbar — slim, iOS-feel, fades in on hover */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: color-mix(in oklab, var(--border-color) 70%, transparent);
        border-radius: 999px;
        transition: background var(--dur-ios) var(--ease-ios);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #71717a;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color var(--dur-ios-slow) var(--ease-ios),
                    color var(--dur-ios-slow) var(--ease-ios);
      }

      /* ── Press-down affordance on every interactive surface ──
         Matches the iOS feel of tiles that "push" into the screen
         when you tap them. Kept global so we don't need to touch
         every button's className. */
      button,
      [role="button"],
      .pip-textarea,
      a {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition:
          transform  var(--dur-ios-fast) var(--ease-ios),
          opacity    var(--dur-ios-fast) var(--ease-ios),
          background var(--dur-ios)      var(--ease-ios),
          border-color var(--dur-ios)    var(--ease-ios),
          box-shadow var(--dur-ios)      var(--ease-ios),
          color      var(--dur-ios)      var(--ease-ios);
      }
      button:active,
      [role="button"]:active {
        transform: scale(0.965);
      }

      /* ── Streaming caret — blinks at the end of the last token ──
         Pure CSS, no state. Rendered by the <span className="stream-caret" />
         we added to the streaming bubble in App.tsx. */
      .stream-caret {
        display: inline-block;
        width: 2px;
        height: 1.05em;
        margin-left: 2px;
        vertical-align: -0.15em;
        background: currentColor;
        border-radius: 1px;
        opacity: 0.85;
        animation: stream-caret-blink 1.05s steps(2, start) infinite;
      }
      @keyframes stream-caret-blink {
        to { visibility: hidden; }
      }

      /* ── iOS spring entrance for message bubbles ──
         Gentle translate + scale that rides the UIKit curve.
         Applied to the `animate-in` utility React already ships. */
      @keyframes ios-bubble-in {
        0%   { opacity: 0; transform: translateY(8px) scale(0.98); }
        100% { opacity: 1; transform: translateY(0)   scale(1);    }
      }
      .animate-in {
        animation: ios-bubble-in var(--dur-ios) var(--ease-ios-out) both;
      }

      /* ── iOS-flavored chat composer ─────────────────────────────
         The textarea + send/auto-solve buttons share one design language
         here — same rounded shell, same iOS-spring transitions, gradient
         circular buttons matching iMessage's look. The previous design
         used flat Tailwind utility colors (bg-primary, bg-purple-600)
         that visually disconnected from the rest of the iOS-aesthetic
         app. */
      /* Composer shell — 2026-07 PREMIUM GLASS. A frosted obsidian slab
         with a real light-catching glass edge (gradient hairline via the
         padding-box mask trick, not a flat border), layered depth
         shadows, and a gold FOCUS BLOOM — inner gold haze + an outer gold
         glow — the moment the textarea is engaged. Radius comes from the
         element's rounded-[1.5rem] utility so nothing here fights the
         global radius remap. */
      .composer-shell {
        position: relative;
        border-radius: 1.5rem;  /* guaranteed even if the rounded-[1.5rem] utility JIT-misses */
        background: linear-gradient(180deg, rgba(20,20,19,0.045) 0%, rgba(20,20,19,0.02) 45%, rgba(20,20,19,0.01) 100%);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.55),
          inset 0 0 0 1px rgba(20,20,19,0.06),
          0 10px 30px -16px rgba(20,20,19,0.16);
        transition: box-shadow var(--dur-ios) var(--ease-ios),
                    background var(--dur-ios) var(--ease-ios);
      }
      .composer-shell:focus-within {
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.55),
          inset 0 0 36px -12px rgba(201,99,66,0.06),       /* faint ambient warmth */
          0 14px 34px -16px rgba(20,20,19,0.18);
      }
      .dark .composer-shell {
        background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.022) 42%, rgba(255,255,255,0.012) 100%);
        -webkit-backdrop-filter: blur(16px) saturate(1.25);
        backdrop-filter: blur(16px) saturate(1.25);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.12),        /* glass top light-catch */
          inset 0 0 0 1px rgba(255,255,255,0.04),        /* whisper ring */
          inset 0 -18px 34px -22px rgba(0,0,0,0.55),     /* inner floor depth */
          0 2px 6px -3px rgba(0,0,0,0.5),                /* tight key */
          0 22px 54px -26px rgba(0,0,0,0.9);             /* soft ambient */
      }
      .dark .composer-shell:focus-within {
        /* Ambient, rich, MINUTE. Focus barely warms the glass — a soft gold
           light felt from inside, not a bright bloom around it. */
        background: linear-gradient(180deg, rgba(255,255,255,0.062) 0%, rgba(255,255,255,0.024) 45%, rgba(211,172,99,0.011) 100%);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.11),            /* glass top highlight */
          inset 0 0 0 1px rgba(255,255,255,0.04),           /* whisper ring (as at rest) */
          inset 0 0 48px -14px rgba(211,172,99,0.07),       /* ambient inner warmth — soft, diffuse */
          inset 0 -18px 34px -22px rgba(0,0,0,0.5),         /* inner floor depth */
          0 2px 6px -3px rgba(0,0,0,0.5),
          0 22px 54px -26px rgba(0,0,0,0.9),                /* the float */
          0 0 20px -16px rgba(211,172,99,0.06);             /* barely-there outer whisper */
      }
      /* The glass edge: a gradient hairline that catches light at the
         top-left and fades to nothing, drawn as a masked 1px border so
         only the ring shows. Blooms gold on focus. */
      .composer-shell::after {
        content: '';
        position: absolute; inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.02) 38%, transparent 62%);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
                mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                mask-composite: exclude;
        pointer-events: none;
        transition: background var(--dur-ios) var(--ease-ios), opacity var(--dur-ios) var(--ease-ios);
      }
      .composer-shell:focus-within::after {
        background: linear-gradient(135deg, rgba(246,228,176,0.11), rgba(211,172,99,0.03) 40%, transparent 60%);
      }
      /* Gold caret in the composer — a small premium signature. */
      .composer-shell textarea { caret-color: var(--gold, #d3ac63); }
      /* The focus affordance lives on the SHELL (its gold glow blooms on
         :focus-within). The inner textarea must draw NO outline of its own,
         or a bright rectangle appears inside the glass. Kill both :focus and
         the global `html.dark :focus-visible` gold outline for it. */
      .composer-shell textarea:focus,
      .composer-shell textarea:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        .composer-shell, .composer-shell::after { transition: none; }
      }

      /* ── Composer buttons (Send / Auto-Solve) ──
         Final iteration: monochrome white-alpha. Iteration history
         that informed this — first attempt was iOS chromatic gradient
         (cheap), second was liquid-glass with sheen and halo (cheaper),
         third was solid blue/violet (classic but still chromatic). User
         pulled all the way to "remove the color, make it classic" —
         which is the right call. At 2M users, chromatic chat-send
         buttons read as "consumer chat app", monochrome icon buttons
         read as "professional tool". Slack, Discord, GitHub, macOS,
         Linear, Notion all converged on this exact pattern in dark
         surfaces: a translucent white-alpha bg at ~7% opacity (just
         visible enough to ground the icon as a button), brightening to
         ~14% on hover, fading to ~3% when disabled. Both buttons share
         identical CSS — Send vs Auto-Solve is communicated entirely by
         the icon glyph (paper-airplane vs scan-search), which is the
         classic pattern for icon-button rows where every button has
         the same shape and only the icon changes. */
      .btn-ios-send,
      .btn-ios-violet {
        flex-shrink: 0;
        background-color: rgba(255, 255, 255, 0.07);
        transition:
          background-color 150ms ease,
          opacity 150ms ease;
      }
      .btn-ios-send:hover:not(:disabled),
      .btn-ios-violet:hover:not(:disabled) {
        background-color: rgba(255, 255, 255, 0.14);
      }
      .btn-ios-send:disabled,
      .btn-ios-violet:disabled {
        background-color: rgba(255, 255, 255, 0.03);
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* Send = the primary action → gold gradient (the landing CTA), the
         composer's focal "go". Auto-Solve stays neutral glass so there's
         one clear gold action, not two competing chips. Disabled send is a
         faded gold, not gray, so the affordance stays on-theme. */
      .dark .btn-ios-send:not(:disabled) {
        background: linear-gradient(145deg, #f6e4b0 0%, #d9b874 55%, #b58f45 100%);
        color: #231c0c;
        box-shadow: 0 6px 18px -6px rgba(211,172,99,0.55), inset 0 1px 0 rgba(255,255,255,0.45);
        transition: background 150ms ease, box-shadow 200ms ease, transform 160ms var(--ease-ios);
      }
      .dark .btn-ios-send:not(:disabled) svg { color: #231c0c; }
      .dark .btn-ios-send:hover:not(:disabled) {
        background: linear-gradient(145deg, #fbeecb 0%, #e2c684 55%, #c69c4e 100%);
        transform: translateY(-1px);
        box-shadow: 0 11px 26px -8px rgba(211,172,99,0.68), inset 0 1px 0 rgba(255,255,255,0.5);
      }
      .dark .btn-ios-send:active:not(:disabled) { transform: translateY(0) scale(0.94); }
      .dark .btn-ios-send:disabled {
        background-color: rgba(211,172,99,0.10);
        opacity: 0.55;
      }
      .dark .btn-ios-send:disabled svg { color: rgba(211,172,99,0.55); }

      /* PiP textarea focus glow upgrade — was a 4px white box-shadow at 6%
         opacity (too subtle to read). Bump to a slightly more visible focus
         ring so users know the textarea is engaged in the popout. Keeps
         the transparent-window aesthetic — no solid fill, just a halo. */
      .pip-textarea:focus {
        box-shadow:
          0 0 0 4px rgba(255, 255, 255, 0.08),
          0 0 14px rgba(255, 255, 255, 0.05);
      }

      /* ── iOS mobile-landing motion primitives ──
         Used by the LandingMobile component in SubscriptionGate.tsx.
         Platform-neutral so the same classes work on minicaai.com from a
         phone browser AND inside the Electron renderer when its window is
         sized down to a phone-width viewport (e.g. dragged narrow on a
         desktop, or a future PWA install). */

      /* Card / section rise-in. Cards start invisible (data-rise selector
         below) and only animate when the IntersectionObserver tags them
         with .ios-rise-active. Stagger via inline animation-delay on each
         card so the row of capability tiles enters in a chevron, not a
         block — matches iOS Settings/Mail-row behavior. */
      [data-rise] {
        opacity: 0;
        transform: translateY(14px) scale(0.985);
      }
      [data-rise].ios-rise-active {
        animation: ios-rise-in var(--dur-summon) var(--spring-summon) forwards;
      }
      @keyframes ios-rise-in {
        from { opacity: 0; transform: translateY(14px) scale(0.985); }
        to   { opacity: 1; transform: translateY(0)    scale(1);     }
      }

      /* Bottom-sheet slide. .ios-sheet-enter on first paint, .ios-sheet-exit
         when dismissed; the React component re-renders with the right class
         and unmounts the node only after the animation lands (see
         closeSheet() in SubscriptionGate.tsx). */
      @keyframes ios-sheet-up   { from { transform: translateY(100%); } to { transform: translateY(0);    } }
      @keyframes ios-sheet-down { from { transform: translateY(0);    } to { transform: translateY(100%); } }
      .ios-sheet-enter { animation: ios-sheet-up   var(--dur-summon)  var(--spring-summon) forwards; }
      .ios-sheet-exit  { animation: ios-sheet-down var(--dur-dismiss) var(--ease-ios-in)   forwards; }

      /* Backdrop fade — paired with sheet animation. Slightly faster on the
         way out so the world re-emerges before the sheet finishes leaving;
         that mismatched timing is the iOS detail people feel but can't name. */
      @keyframes ios-fade-in  { from { opacity: 0; } to { opacity: 1; } }
      @keyframes ios-fade-out { from { opacity: 1; } to { opacity: 0; } }
      .ios-fade-enter { animation: ios-fade-in  240ms var(--ease-ios)    forwards; }
      .ios-fade-exit  { animation: ios-fade-out 220ms var(--ease-ios-in) forwards; }

      /* Press affordance — used on every interactive surface in the mobile
         landing. Subtler than the global button:active scale(0.965) above
         because mobile cards are bigger; over-scaling reads as wobble. */
      .ios-press {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition:
          transform 220ms var(--ease-ios),
          opacity   220ms var(--ease-ios),
          background-color 240ms var(--ease-ios);
      }
      .ios-press:active {
        transform: scale(0.97);
        opacity: 0.92;
      }

      /* Horizontal paged swiper — used by How-it-works and Pricing pagers.
         scroll-snap-stop:always prevents momentum from flicking past two
         cards in one fling, which makes the dot indicator track honestly. */
      .ios-pager {
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        scroll-padding: 0 1.25rem;
        scroll-behavior: smooth;
      }
      .ios-pager::-webkit-scrollbar { display: none; }
      .ios-pager-item {
        scroll-snap-align: center;
        scroll-snap-stop: always;
        flex: 0 0 calc(100% - 2.5rem);
        margin-left: 1.25rem;
      }
      .ios-pager-item:last-child { margin-right: 1.25rem; }

      /* Safe-area passthroughs so the layout respects notch / home-indicator
         on real iPhones. Use max() with 0px so non-supporting browsers (and
         Android viewports without env-inset values) still produce a sane 0. */
      .pt-safe { padding-top:    max(env(safe-area-inset-top),    0px); }
      .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 0px); }

      /* ── Auth form primitives (login / signup / forgot_password) ──
         These live as a shared class layer because the inputs use inline
         CSS variables for theme tokens (var(--cream), var(--accent), etc.)
         and Tailwind's :focus utilities can't reference those at runtime.
         Keeping the focus / link / animation styles here also means we
         don't have to repeat the same bag of style overrides on every
         input across three nearly-identical views. */

      /* Input focus state — keep the glass look. The old rule swapped in a
         bright accent border + 3px halo on focus, which read as a glowing
         outline against the obsidian card (owner: "keep them plain, like
         the glass input boxes"). Focus now only nudges the existing hairline
         toward the ink color — barely brighter in dark, barely darker in
         light — so keyboard users still get a signal without a bright line.
         !important is required: the inputs set their border inline. */
      .auth-input {
        transition:
          border-color 200ms var(--ease-ios),
          box-shadow 200ms var(--ease-ios),
          background-color 200ms var(--ease-ios);
      }
      .auth-input:focus {
        border-color: color-mix(in oklab, var(--ink) 22%, var(--cream-line)) !important;
        box-shadow: none;
        outline: none;
      }
      .auth-input::placeholder {
        color: var(--ink-faint);
      }

      /* Inline link styling — the "Forgot password?" / "Create one" /
         "Sign in" buttons inside text. Color shift on hover plus a subtle
         underline so they actually read as clickable. */
      .auth-link {
        transition: color 200ms var(--ease-ios), opacity 200ms var(--ease-ios);
        text-underline-offset: 3px;
        text-decoration-thickness: 1px;
      }
      .auth-link:hover {
        text-decoration: underline;
      }

      /* Top-right close (X) button — was using hover:opacity-80 on already-
         muted text, which just made it less visible on hover. Replace with
         a proper background fade + color shift. */
      .auth-close {
        transition:
          background-color 200ms var(--ease-ios),
          color 200ms var(--ease-ios);
      }
      .auth-close:hover {
        background-color: color-mix(in oklab, var(--ink) 6%, transparent);
        color: var(--ink) !important;
      }

      /* Submit button — keeps the icon slot ALWAYS rendered (spinner OR
         arrow) so the button width / text position doesn't shift between
         idle and loading states. */
      .auth-submit {
        transition:
          opacity 200ms var(--ease-ios),
          transform 200ms var(--ease-ios);
      }
      .auth-submit:hover:not(:disabled) {
        opacity: 0.92;
      }

      /* Auth card entrance — gentle fade + lift when the view first mounts
         so navigating from landing → login doesn't feel like a hard cut. */
      @keyframes auth-card-in {
        from { opacity: 0; transform: translateY(8px) scale(0.99); }
        to   { opacity: 1; transform: translateY(0)   scale(1);    }
      }
      .auth-card {
        animation: auth-card-in 320ms var(--ease-ios-out) both;
      }

      /* Electron pop-out window transparency */
      html.electron-transparent,
      html.electron-transparent body {
        background: transparent !important;
        background-color: transparent !important;
      }

      /* ── Pop-out mode cursor override ──
         Forces default cursor in popout to look natural on screen share.
         Interviewers won't see suspicious hand cursors on buttons. */
      html.popout-mode,
      html.popout-mode body,
      html.popout-mode * {
        cursor: default !important;
      }
      html.popout-mode textarea,
      html.popout-mode input[type="text"],
      html.popout-mode input[type="email"],
      html.popout-mode input[type="password"] {
        cursor: text !important;
      }

      /* ── Model picker — compact rows (popout + input-area popovers) ──
         Same component, two variants (variant="compact" here; variant="full"
         is .mp-card below). Compact rows live inside a portal'd popover that
         shares the popout window's compositor surface — we keep the styling
         CSS-only (no JS animation) so it inherits setContentProtection like
         every other surface drawn into the BrowserWindow.
         Brand colors come from inline style vars (--mp-accent etc.) set per
         row from MODEL_REGISTRY; Max gets its own classed treatment because
         its border is a CSS gradient (can't be expressed as a single color
         token). */
      .mp-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        font-size: 11px;
        color: rgba(244, 244, 245, 0.92);
        cursor: pointer;
        border-radius: 6px;
        transition: background-color 160ms var(--ease-ios);
      }
      .mp-row:hover { background: rgba(255, 255, 255, 0.06); }
      .mp-row.is-selected { background: rgba(255, 255, 255, 0.04); }
      .mp-row.is-locked { color: rgba(244, 244, 245, 0.55); }
      .mp-row.is-locked:hover { background: rgba(255, 255, 255, 0.04); }
      .mp-mono {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 5px;
        border: 1px solid;
        font-weight: 700;
        font-size: 11px;
        line-height: 1;
        flex-shrink: 0;
      }
      /* Max monogram — amber→purple gradient chip, matching the in-app
         Max dialect (chat-header chip uses the same amber-500/10 →
         purple-500/10 tokens). Marketing-dialect cream/gold stays out of
         this surface per the palette comment at the top of this file. */
      .mp-mono-max {
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(168, 85, 247, 0.22));
        border: 1px solid rgba(245, 158, 11, 0.55);
        color: #fcd34d;
      }
      .mp-name { flex: 1; min-width: 0; }
      .mp-check { opacity: 0.85; }
      .mp-locked {
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.06em;
        padding: 1px 5px;
        border-radius: 3px;
        background: rgba(251, 191, 36, 0.10);
        color: rgba(251, 191, 36, 0.85);
        border: 1px solid rgba(251, 191, 36, 0.30);
      }
      .mp-locked-max {
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.16), rgba(168, 85, 247, 0.16));
        color: #fcd34d;
        border: 1px solid rgba(245, 158, 11, 0.50);
      }

      /* ── Model picker — rich cards (settings panel) ──
         The "world's richest" treatment lives here. Restraint over flash:
         deep ink surfaces, hairline brand-color rails for Pro/Basic models,
         tonal-gold metallic border + slow cream sheen for Max — closer to
         a fine watch case-back or an Amex Centurion card than a neon
         gradient. Newsreader serif (already preconnected at the top of
         this file) carries the Max flagship label.
         All animation is CSS-only and respects prefers-reduced-motion via
         the global media query at the bottom of this stylesheet. */
      .mp-card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 14px 16px 14px 18px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.015), rgba(255, 255, 255, 0)),
          rgba(15, 15, 18, 0.72);
        text-align: left;
        cursor: pointer;
        transition:
          border-color 220ms var(--ease-ios),
          background-color 220ms var(--ease-ios),
          box-shadow 240ms var(--ease-ios),
          transform 220ms var(--ease-ios);
        overflow: hidden;
      }
      .mp-card:hover {
        border-color: color-mix(in oklab, var(--mp-accent, #71717a) 55%, transparent);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0)),
          rgba(20, 20, 24, 0.80);
      }
      /* Selected state for non-Max cards: 2px brand-color border + soft
         brand-tinted glow (tonal, not neon). */
      .mp-card.is-selected {
        border-color: var(--mp-accent, #71717a);
        box-shadow:
          0 0 0 1px var(--mp-accent, transparent) inset,
          0 8px 28px -12px color-mix(in oklab, var(--mp-accent, transparent) 55%, transparent);
      }
      .mp-card.is-locked {
        opacity: 0.55;
        cursor: pointer;
      }
      .mp-card.is-locked:hover { opacity: 0.78; }
      .mp-card:active:not(.is-locked) { transform: scale(0.992); }

      /* Brand-color rail — runs the full height of the card on the left,
         3px wide. Gives Pro/Basic models a credit-card-stripe accent
         without competing with the Max card's gold border. */
      .mp-card::before {
        content: '';
        position: absolute;
        left: 0; top: 12px; bottom: 12px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--mp-accent, transparent);
        opacity: 0.55;
        transition: opacity 220ms var(--ease-ios);
      }
      .mp-card:hover::before { opacity: 0.85; }
      .mp-card.is-selected::before { opacity: 1; }
      .mp-card.is-locked::before { opacity: 0.20; }

      /* ── Max card — flagship treatment in the in-app dialect ──
         Same dark zinc surface as the other cards (no foreign cream/ink
         palette — that one's reserved for marketing/auth surfaces, see
         the comment block at the top of this file). Max distinction is
         a hairline amber→purple gradient rim that mirrors the chat-header
         and popout Max chips, plus a slightly stronger inner background
         tint. No animation — keeps the settings panel quiet during long
         interview sessions. */
      .mp-card-max {
        background:
          radial-gradient(140% 100% at 0% 0%, rgba(245, 158, 11, 0.06), transparent 55%),
          radial-gradient(120% 100% at 100% 100%, rgba(168, 85, 247, 0.05), transparent 55%),
          rgba(15, 15, 18, 0.78);
        border: 1px solid transparent;
      }
      /* Amber→purple rim painted via the standard mask-composite trick.
         The .mp-card::before from above is repurposed as the perimeter
         rim instead of a 3px left bar — same pseudo-element, redefined
         for Max so the brand-rail rule is fully overridden, not stacked. */
      .mp-card-max::before {
        content: '';
        position: absolute;
        inset: 0;
        left: 0;
        top: 0;
        bottom: 0;
        width: auto;
        padding: 1px;
        border-radius: inherit;
        /* Refined obsidian-gold hairline (was a saturated amber→purple
           band). Softer stops read as a fine metallic line, not a thick
           rim — and gold matches the rest of the app instead of the
           leftover purple. */
        background: linear-gradient(135deg,
          rgba(246, 228, 176, 0.58) 0%,
          rgba(211, 172, 99, 0.42) 48%,
          rgba(181, 143, 69, 0.44) 100%);
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
                mask-composite: exclude;
        pointer-events: none;
        opacity: 0.70;
        transition: opacity 240ms var(--ease-ios);
      }
      .mp-card-max:hover::before { opacity: 0.9; }
      /* Selection BRIGHTENS the same 1px line — it does NOT thicken it
         (the old padding:2px is what read as a giant border). The
         "selected" signal comes from a soft gold lift below. */
      .mp-card-max.is-selected::before {
        opacity: 1;
        padding: 1px;
      }
      .mp-card-max.is-selected {
        box-shadow: 0 10px 32px -16px rgba(211, 172, 99, 0.45);
      }
      .mp-card-max.is-locked::before { opacity: 0.45; }

      /* Monogram chip — colored square housing the model letter. Pro/Basic
         pull color from inline-style vars; Max has its own metallic chip. */
      .mp-card-mono {
        flex-shrink: 0;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 18px;
        line-height: 1;
        border: 1px solid var(--mp-accent, rgba(255, 255, 255, 0.08));
        background: var(--mp-chip, rgba(255, 255, 255, 0.04));
        color: var(--mp-fg, #e4e4e7);
        transition: transform 220ms var(--ease-ios), box-shadow 220ms var(--ease-ios);
      }
      .mp-card:hover .mp-card-mono { transform: translateY(-1px); }
      .mp-card.is-selected .mp-card-mono {
        box-shadow: 0 0 0 1px var(--mp-accent) inset, 0 6px 18px -8px var(--mp-accent);
      }
      /* Max monogram — refined gold chip, same obsidian-gold palette as
         the rim (was amber→purple). */
      .mp-card-mono-max {
        background: linear-gradient(135deg, rgba(246, 228, 176, 0.16), rgba(181, 143, 69, 0.12));
        border: 1px solid rgba(211, 172, 99, 0.50);
        color: #f6e4b0;
      }
      .mp-card-max:hover .mp-card-mono-max { transform: translateY(-1px); }
      .mp-card-max.is-selected .mp-card-mono-max {
        box-shadow:
          0 0 0 1px rgba(211, 172, 99, 0.50) inset,
          0 6px 22px -6px rgba(211, 172, 99, 0.30);
      }

      /* Body — name + tagline */
      .mp-card-body {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        min-width: 0;
      }
      .mp-card-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      .mp-card-name {
        font-size: 13.5px;
        font-weight: 600;
        color: rgba(244, 244, 245, 0.95);
        letter-spacing: -0.01em;
      }
      .mp-card-tag {
        font-size: 11px;
        line-height: 1.4;
        color: rgba(244, 244, 245, 0.55);
      }

      /* Right-side affordance — Active chip / lock badge */
      .mp-card-right {
        flex-shrink: 0;
        display: flex;
        align-items: center;
      }
      /* Active = a quiet "live" indicator, not a loud pill: a small green
         glowing dot + a low-weight label. Green reads instantly as "on"
         and stays distinct from the gold selected-card chrome. */
      .mp-card-active {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.01em;
        text-transform: none;
        padding: 0;
        background: none;
        border: none;
        color: rgba(244, 244, 245, 0.62);
      }
      .mp-live-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 6px rgba(52, 211, 153, 0.7);
        animation: mp-live-pulse 2.4s ease-out infinite;
      }
      @keyframes mp-live-pulse {
        0%   { box-shadow: 0 0 6px rgba(52,211,153,0.70), 0 0 0 0 rgba(52,211,153,0.45); }
        70%  { box-shadow: 0 0 6px rgba(52,211,153,0.70), 0 0 0 5px rgba(52,211,153,0); }
        100% { box-shadow: 0 0 6px rgba(52,211,153,0.70), 0 0 0 0 rgba(52,211,153,0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mp-live-dot { animation: none; }
      }
      /* Max keeps the same quiet green live-dot — the gold flagship rim
         already carries the tier signal, so no gold pill here. */
      .mp-card-active-max {
        color: rgba(244, 244, 245, 0.62);
        background: none;
        border: none;
      }
      .mp-card-lock {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.10em;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(251, 191, 36, 0.10);
        color: rgba(251, 191, 36, 0.90);
        border: 1px solid rgba(251, 191, 36, 0.32);
      }
      .mp-card-lock-max {
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.18), rgba(168, 85, 247, 0.16));
        color: #fcd34d;
        border: 1px solid rgba(245, 158, 11, 0.50);
      }
      /* Inline badges — "Recommended" (GPT) and "Flagship" (Claude) */
      /* Badges are quiet labels, not filled pills — small-caps, light
         weight, no border/background. Recommended = muted gold; Flagship
         = a brighter gold ✦ + label. */
      .mp-card-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        padding: 0;
        background: none;
        border: none;
        white-space: nowrap;
      }
      .mp-card-badge-recommended {
        color: rgba(211, 172, 99, 0.72);
      }
      .mp-card-badge-flagship {
        color: rgba(211, 172, 99, 0.92);
      }
      /* Tier-upgrade hint in the model-selection header — ONE refined gold
         hairline treatment (replaces three mismatched amber pills). Quiet,
         premium, and consistent with the obsidian-and-gold system. */
      .mp-hint {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.015em;
        color: #f0d9a0;
        background: rgba(201, 165, 92, 0.08);
        border: 1px solid rgba(201, 165, 92, 0.26);
        border-radius: 999px;
        padding: 3px 10px;
        white-space: nowrap;
      }
      .mp-hint svg { opacity: 0.85; }

      /* ── Premium "gold glass" primary button ──
         Replaces the bright solid gold-gradient fills (e.g. Save Settings)
         with a frosted, gold-tinted glass surface + gold hairline + warm
         gold text. Far less bright than the old #e8cf8f→#c9a655 fill, but
         still unmistakably the primary action. Reusable everywhere those
         bright gold buttons live. */
      .btn-gold-glass {
        position: relative;
        color: #f0d9a0;
        background: linear-gradient(180deg, rgba(211, 172, 99, 0.17), rgba(211, 172, 99, 0.075));
        border: 1px solid rgba(211, 172, 99, 0.34);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 6px 20px -14px rgba(211, 172, 99, 0.35);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        transition:
          background 200ms var(--ease-ios),
          border-color 200ms var(--ease-ios),
          box-shadow 200ms var(--ease-ios),
          transform 160ms var(--ease-ios);
      }
      .btn-gold-glass:hover {
        background: linear-gradient(180deg, rgba(211, 172, 99, 0.24), rgba(211, 172, 99, 0.12));
        border-color: rgba(211, 172, 99, 0.50);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 8px 26px -14px rgba(211, 172, 99, 0.45);
      }
      .btn-gold-glass:active { transform: translateY(0.5px); }

      /* ── Compact full-card variant ──
         Used for the four non-Max models in the settings panel's 2-col
         grid. Same visual language (brand rail, monogram chip, name) but
         shrunken so the four cards plus the full-width Claude showcase
         all fit in the modal without scrolling. Tagline is dropped — the
         model name + colored chip already telegraphs identity, and the
         showcase Claude card carries the marketing weight. */
      .mp-card.is-compact {
        padding: 10px 14px 10px 16px;
        gap: 11px;
      }
      .mp-card.is-compact .mp-card-mono {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        font-size: 17px;
      }
      .mp-card.is-compact::before {
        top: 8px;
        bottom: 8px;
      }
      .mp-card.is-compact .mp-card-name {
        font-size: 12.5px;
      }
      .mp-card.is-compact .mp-card-tag { display: none; }
      .mp-card.is-compact .mp-card-active,
      .mp-card.is-compact .mp-card-lock {
        font-size: 8.5px;
        padding: 3px 7px;
        letter-spacing: 0.08em;
      }
      .mp-card.is-compact .mp-card-badge {
        font-size: 8px;
        padding: 2px 6px;
      }

      /* Respect reduced-motion preference — disables all iOS springs */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
