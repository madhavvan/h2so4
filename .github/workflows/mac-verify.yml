name: Mac end-to-end verify

# One-off diagnostic: downloads the latest published macOS artifacts and
# exercises the full Apple Gatekeeper pipeline against them. Tells us
# definitively whether a real Mac user can double-click and have macOS
# open the app without the "Apple could not verify" hoop.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: End-to-end verify (single bash block, no -e)
        shell: bash
        run: |
          set +e
          mkdir -p ~/verify && cd ~/verify

          echo ""
          echo "============================================================"
          echo "  STEP 1: Download v4.0.8 mac artifacts"
          echo "============================================================"
          for f in InterviewCopilot-Mac-arm64.dmg InterviewCopilot-Mac-arm64.zip InterviewCopilot-Mac-x64.dmg InterviewCopilot-Mac-x64.zip; do
            curl -sL -o "$f" "https://github.com/madhavvan/h2so4/releases/latest/download/$f"
            ls -lh "$f"
          done

          echo ""
          echo "============================================================"
          echo "  STEP 2: ZIP path (auto-updater uses ZIP) — arm64"
          echo "============================================================"
          mkdir -p ./z-arm64 && ditto -x -k InterviewCopilot-Mac-arm64.zip ./z-arm64
          APP_ZIP_ARM64=$(find ./z-arm64 -name "*.app" -maxdepth 3 -print -quit)
          echo "app path: $APP_ZIP_ARM64"
          echo ""
          echo "--- codesign --verify --deep --strict ---"
          codesign --verify --deep --strict --verbose=2 "$APP_ZIP_ARM64"
          echo "codesign exit: $?"
          echo ""
          echo "--- codesign --display (Developer ID identity?) ---"
          codesign --display --verbose=2 "$APP_ZIP_ARM64" 2>&1 | head -10
          echo ""
          echo "--- spctl --assess --type execute (Gatekeeper verdict) ---"
          spctl --assess --type execute --verbose=4 "$APP_ZIP_ARM64"
          echo "spctl exit: $?"
          echo ""
          echo "--- stapler validate (notarization ticket ATTACHED to bundle?) ---"
          xcrun stapler validate "$APP_ZIP_ARM64"
          echo "stapler exit: $?  (0=ticket attached/offline-OK,  65=not stapled,  66=no ticket online either)"
          echo ""
          echo "--- Helper apps inside Frameworks/ ---"
          find "$APP_ZIP_ARM64/Contents/Frameworks" -name "*.app" -maxdepth 3 2>/dev/null | while read -r helper; do
            HNAME=$(basename "$helper")
            echo "[$HNAME]"
            codesign --verify --strict --verbose=1 "$helper" 2>&1 | head -2
            xcrun stapler validate "$helper" 2>&1 | head -1
          done

          echo ""
          echo "============================================================"
          echo "  STEP 3: DMG path (what users download from website) — arm64"
          echo "============================================================"
          MOUNT_LINE=$(hdiutil attach -nobrowse -readonly InterviewCopilot-Mac-arm64.dmg | grep "/Volumes/")
          echo "mount line: $MOUNT_LINE"
          MOUNT_DIR=$(echo "$MOUNT_LINE" | grep -oE '/Volumes/.*$')
          echo "mount dir: $MOUNT_DIR"
          APP_DMG_ARM64=$(find "$MOUNT_DIR" -name "*.app" -maxdepth 2 -print -quit 2>/dev/null)
          echo "app path: $APP_DMG_ARM64"
          echo ""
          echo "--- codesign --verify on DMG-mounted app ---"
          codesign --verify --deep --strict --verbose=2 "$APP_DMG_ARM64"
          echo "exit: $?"
          echo ""
          echo "--- stapler validate on DMG-mounted app ---"
          xcrun stapler validate "$APP_DMG_ARM64"
          echo "exit: $?"
          echo ""
          echo "--- stapler validate on the DMG itself ---"
          xcrun stapler validate InterviewCopilot-Mac-arm64.dmg
          echo "exit: $?"
          hdiutil detach "$MOUNT_DIR" -quiet 2>/dev/null

          echo ""
          echo "============================================================"
          echo "  STEP 4: ZIP path — x64"
          echo "============================================================"
          mkdir -p ./z-x64 && ditto -x -k InterviewCopilot-Mac-x64.zip ./z-x64
          APP_ZIP_X64=$(find ./z-x64 -name "*.app" -maxdepth 3 -print -quit)
          echo "app: $APP_ZIP_X64"
          codesign --verify --deep --strict --verbose=2 "$APP_ZIP_X64"
          echo "codesign exit: $?"
          spctl --assess --type execute --verbose=4 "$APP_ZIP_X64"
          echo "spctl exit: $?"
          xcrun stapler validate "$APP_ZIP_X64"
          echo "stapler exit: $?"

          echo ""
          echo "============================================================"
          echo "  STEP 5: Simulate FRESH Mac user — quarantine + double-click"
          echo "============================================================"
          cp -R "$APP_ZIP_ARM64" /tmp/InstalledApp.app
          xattr -w com.apple.quarantine "0083;0;Safari;0" /tmp/InstalledApp.app
          echo "applied quarantine xattr:"
          xattr -l /tmp/InstalledApp.app
          echo ""
          echo "--- spctl --assess on quarantined app (THE actual double-click verdict) ---"
          spctl --assess --type execute --verbose=4 /tmp/InstalledApp.app
          echo "exit: $?  (0=opens cleanly,  3=Gatekeeper rejects, user sees the bad dialog)"

          echo ""
          echo "============================================================"
          echo "  SUMMARY KEYS"
          echo "============================================================"
          echo "  • codesign exit 0       → bundle signature intact"
          echo "  • spctl exit 0          → Gatekeeper would accept (clean install UX)"
          echo "  • spctl exit 3          → Gatekeeper rejects (BAD dialog)"
          echo "  • stapler exit 0        → ticket stapled (offline-friendly first launch)"
          echo "  • stapler exit 65/66    → not stapled (online users OK, offline users hit dialog)"
