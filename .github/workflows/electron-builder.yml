name: Build and Release Desktop App

# Trigger matrix:
#   release: published  — the ONLY release trigger. GitHub emits `published`
#                         both when a draft flips to published (the
#                         electron-builder local-publish flow) and when a
#                         release is created directly in published state
#                         (`gh release create`), so the old additional
#                         `created` trigger only ever produced a DUPLICATE
#                         run — whose parallel upload step raced this one's
#                         (v4.0.12 lost latest-linux.yml to exactly that
#                         race) and doubled CI minutes per release.
#   workflow_dispatch   — manual trigger from the Actions tab. Note: with
#                         `--publish never`, dispatch runs upload nothing
#                         (the upload step is gated to release events) —
#                         backfill by re-publishing the release instead.
#
# ── THE ORDER MATTERS, AND IT IS NOT ENFORCED BY GITHUB ──
#
#   1. npm run release:draft -- v4.0.23     (invisible; not "latest")
#   2. npm run electron:publish             (builds + SIGNS Windows locally,
#                                            uploads it into that draft)
#   3. publish the draft                    (this fires the workflow below)
#   4. CI builds mac + linux, mirrors, verifies
#
# Step 1 exists because a published release is "latest" the instant it is
# created, assets or not — that is how v4.0.22 spent two hours serving
# Windows an error page. A DRAFT is invisible, so the window between
# "release exists" and "release is installable" is not a window users can
# fall into.
#
# ⚠️ Do NOT try to get this by setting publish[].releaseType to "draft".
# That value is also written into app-update.yml INSIDE the shipped app,
# and an installed client configured for drafts cannot see any release
# anonymously — it would break auto-update for every user. scripts/
# verify-release-feed.mjs fails the build on exactly that.
#
# gate-release-is-installable below is the backstop for when this order is
# not followed, because a comment has never stopped anybody.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  A RELEASE WITHOUT WINDOWS MUST NOT STAY "LATEST".
  #
  #  2026-08-09, v4.0.22: the release was created with `gh release create`
  #  before the Windows installer existed. GitHub makes a release `latest`
  #  the instant it is published, assets or not, so for two hours every
  #  Windows visitor got the unavailable page while a good 4.0.21 installer
  #  sat one release back.
  #
  #  Why Windows specifically: macOS and Linux are built by THIS workflow
  #  and legitimately arrive ~10 minutes after publish. Windows is built
  #  and signed locally (see the matrix note below — CI has no Azure
  #  Trusted Signing secrets), so if it is not in the release at the moment
  #  of publish, nothing downstream is going to put it there.
  #
  #  Every prior release passed this by accident: electron-builder CREATED
  #  the release as part of the Windows publish, so the file and the
  #  release arrived in the same operation — v4.0.18 through v4.0.21 all
  #  show Setup.exe landing within one second of published_at. Publishing
  #  by hand decouples them, and nothing noticed.
  #
  #  This runs before the builds and demotes the release to prerelease on
  #  both repos, which puts GitHub's `latest` pointer back on the previous
  #  good version within about a minute. It fails the run on purpose: an
  #  incomplete release should look broken in the Actions tab.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  gate-release-is-installable:
    name: Refuse to ship a release with no Windows installer
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Windows installer must already be attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -uo pipefail
          have=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            | grep -c '"name": *"InterviewCopilot-Setup.exe"' || true)
          if [ "$have" != "0" ]; then
            echo "::notice::Windows installer present on ${TAG} — release is installable."
            exit 0
          fi

          echo "::error title=Release has no Windows installer::${TAG} is published and is now GitHub's 'latest', but InterviewCopilot-Setup.exe is not attached. Demoting it to prerelease so downloads fall back to the previous release."

          # Source repo — GITHUB_TOKEN can write here.
          curl -sS -X PATCH -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -d '{"prerelease":true}' -o /dev/null

          # Feed repo — needs the PAT; without it, say so loudly rather than
          # leaving a half-demoted pair of feeds.
          if [ -n "${FEED_TOKEN}" ]; then
            fid=$(curl -sS -H "Authorization: Bearer ${FEED_TOKEN}" \
              "https://api.github.com/repos/madhavvan/interviewcopilot-releases/releases/tags/${TAG}" \
              | sed -n 's/.*"id": *\([0-9]*\).*/\1/p' | head -1)
            if [ -n "${fid}" ]; then
              curl -sS -X PATCH -H "Authorization: Bearer ${FEED_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/madhavvan/interviewcopilot-releases/releases/${fid}" \
                -d '{"prerelease":true}' -o /dev/null
              echo "::notice::Demoted ${TAG} on the feed repo too."
            fi
          else
            echo "::warning title=Feed repo NOT demoted::RELEASES_REPO_TOKEN is unset, so ${TAG} is still 'latest' on the update feed. Demote it by hand."
          fi
          exit 1

  release:
    # Hard cap so a slow Apple notarization can't hang the build for hours.
    # A healthy notarized 2-arch build runs ~40-55 min; past this the job
    # fails cleanly instead of waiting on Apple's notary service forever.
    strategy:
      fail-fast: false
      matrix:
        include:
          # buildOnDispatch=false on Windows: we sign Windows locally via
          # Azure Trusted Signing (CI doesn't have AZURE_CLIENT_SECRET set),
          # so a CI rebuild would replace the signed .exe with an unsigned
          # one that triggers SmartScreen warnings. Skip Windows on manual
          # triggers; keep it on real release events so the first signed
          # build in a fresh CI setup with proper secrets still works.
          - os: windows-latest
            platform: --win
            buildOnDispatch: false
          - os: macos-latest
            platform: --mac
            buildOnDispatch: true
          - os: ubuntu-latest
            platform: --linux
            buildOnDispatch: true

    runs-on: ${{ matrix.os }}

    # Job-level so the mirror step's `if:` can test it. A step's own `env:`
    # block is not reliably in scope for that step's own conditional, and a
    # secret cannot be referenced from an `if:` directly.
    env:
      FEED_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}

    steps:
      - name: Decide if this matrix entry should build
        id: gate
        # Build only when matrix.buildOnDispatch=true. The prior gate also
        # ran on `release: *` events, which made the Windows job try to
        # build in CI on every release — but CI doesn't carry the Azure
        # Trusted Signing secrets (AZURE_CLIENT_SECRET / TENANT / CLIENT
        # IDs), so the signing step always failed and produced a red X
        # alongside the (already-uploaded, locally-signed) Windows .exe
        # in the release. Windows builds locally via `npm run electron:
        # publish` and is uploaded to the release before CI ever fires;
        # Mac and Linux are the platforms CI handles. If we ever wire
        # the Azure secrets into GitHub repo secrets, flip Windows'
        # buildOnDispatch to true to re-enable CI rebuilds for it.
        run: |
          if [ "${{ matrix.buildOnDispatch }}" = "true" ]; then
            echo "go=1" >> $GITHUB_OUTPUT
          else
            echo "go=0" >> $GITHUB_OUTPUT
            echo "::notice::Skipping ${{ matrix.os }} — locally-signed builds aren't rebuilt by CI."
          fi
        shell: bash

      - name: Checkout code
        if: steps.gate.outputs.go == '1'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.gate.outputs.go == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build deps
        if: steps.gate.outputs.go == '1' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Install dependencies
        if: steps.gate.outputs.go == '1'
        run: npm ci

      - name: Build Vite app
        if: steps.gate.outputs.go == '1'
        run: npm run build

      # macOS notarization uses an App Store Connect API key. The .p8 key
      # file is stored base64-encoded in the APPLE_API_KEY_P8 secret; decode
      # it onto the runner so APPLE_API_KEY can point at a real file path.
      - name: Write Apple API key (macOS notarization)
        if: steps.gate.outputs.go == '1' && runner.os == 'macOS'
        run: echo "${{ secrets.APPLE_API_KEY_P8 }}" | openssl base64 -d -A > "$RUNNER_TEMP/AuthKey.p8"
        shell: bash

      - name: Build Electron app (no publish — assets are attached below)
        # package.json's publish names TWO targets, in this order:
        #   1. madhavvan/interviewcopilot-releases  ← baked into app-update.yml
        #   2. madhavvan/h2so4                      ← legacy feed for <=v4.0.9
        # Entry #1 is the one electron-builder writes into every artifact's
        # app-update.yml, so it is the feed the shipped fleet will phone home
        # to. That is why BOTH upload steps below must run: an artifact whose
        # channel file lands only on h2so4 is invisible to every client built
        # from this config.
        #
        # History worth keeping: v4.0.11-v4.0.16 listed interviewcopilot-
        # releases first while that repo did not exist AND with releaseType
        # `draft`, so every one of those builds shipped with a feed that 404s
        # on its first request — the entire fleet has been unable to auto-
        # update since 2026-07-18. Two rules fall out of that:
        #   - the #1 target must be a repo that EXISTS and is PUBLIC, and
        #   - releaseType must be `release`; drafts appear in neither
        #     releases.atom nor /releases/latest, so a draft feed is a dead
        #     feed even when the repo is real.
        # `npm run release:verify` asserts both against the live feed.
        #
        # NOTE: --publish never means workflow_dispatch backfills upload
        # nothing (both upload steps are gated to release events) — backfill
        # by re-publishing the release instead.
        if: steps.gate.outputs.go == '1'
        run: npx electron-builder ${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing — Developer ID Application cert as a base64
          # .p12 in CSC_LINK. Unused by the Linux build; the Windows job
          # doesn't run in CI (it's signed locally via Azure Trusted Signing).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization via App Store Connect API key.
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: List built files
        if: steps.gate.outputs.go == '1'
        run: ls -la dist-electron/
        shell: bash

      # Belt-and-suspenders: electron-builder's publish should already have
      # attached every relevant file (binary + blockmap + latest-*.yml) to
      # the release. softprops re-uploads anything missed without overwriting
      # successful uploads. This one targets the repo that fired the event
      # (h2so4) — it is the LEGACY feed, still read by <=v4.0.9 installs.
      - name: Upload additional files to the source-repo release (legacy feed)
        uses: softprops/action-gh-release@v2
        if: steps.gate.outputs.go == '1' && github.event_name == 'release'
        with:
          files: |
            dist-electron/*.yml
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # THE ONE THAT REACHES USERS. secrets.GITHUB_TOKEN is scoped to this
      # repo only, so the step above physically cannot write to the update-
      # feed repo — without this step, CI-built macOS and Linux artifacts
      # (and, critically, latest-mac.yml / latest-linux.yml) never reach the
      # feed that every shipped app-update.yml points at, and Mac/Linux users
      # stay stranded even though Windows works. Requires a PAT with
      # `contents: write` on madhavvan/interviewcopilot-releases, stored as
      # the RELEASES_REPO_TOKEN secret on THIS repo.
      #
      # Gated on the secret being present so a fork or a fresh clone without
      # the secret still completes the legacy upload instead of failing red.
      # If it is skipped, `npm run release:mirror -- <tag>` does the same job
      # from a workstation. Either way, `npm run release:verify` is what
      # proves the feed is actually serving before you call a release done.
      - name: Mirror artifacts to the update-feed repo (what users update from)
        uses: softprops/action-gh-release@v2
        if: steps.gate.outputs.go == '1' && github.event_name == 'release' && env.FEED_TOKEN != ''
        with:
          repository: madhavvan/interviewcopilot-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: false
          files: |
            dist-electron/*.yml
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.blockmap

  # ────────────────────────────────────────────────────────────────────
  #  THE GATE THAT WAS MISSING
  #
  #  Everything above can go green while the fleet sees nothing. That is
  #  not hypothetical — it is what happened to v4.0.11 through v4.0.16:
  #  each build succeeded, each release was tagged, and every installed
  #  app polled a feed repo that did not exist. Nobody found out from CI,
  #  because CI only ever asserted that the BUILD worked.
  #
  #  `release:verify` walks the four anonymous HTTP steps a shipped app
  #  actually performs — releases.atom, /releases/latest, the per-platform
  #  channel file, then a ranged GET of every asset it names — against
  #  every configured feed. It is the only check here that can tell the
  #  difference between "we published a release" and "users can install
  #  it".
  #
  #  It existed before this job did, as a manual step documented in a
  #  comment. A manual step is exactly the kind that stops happening, so
  #  it runs here instead.
  #
  #  needs: release — must not start until every matrix entry has
  #  uploaded, or it would fail on artifacts that are merely not there
  #  yet. Retries absorb GitHub's CDN propagation delay on top of that.
  # ────────────────────────────────────────────────────────────────────
  verify-feed:
    name: Verify the update feed actually serves this release
    needs: release
    # `always()` so a skipped Windows entry (buildOnDispatch=false) does
    # not skip the gate. A genuinely FAILED build still short-circuits:
    # there is nothing to verify, and a red feed report on top of a red
    # build only obscures the real cause.
    if: always() && github.event_name == 'release' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    # Job-level so the dispatch step's `if:` can test it. A step's own env
    # block is not reliably in scope for that step's own conditional, and a
    # secret cannot be referenced from an `if:` directly.
    env:
      FEED_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── ASK THE FEED TO MIRROR BEFORE ASKING WHETHER IT SERVES ──
      #
      # This job used to verify immediately after the builds and fail on
      # macOS every single time — v4.0.19, v4.0.20 and v4.0.21 all show the
      # same red X with three GREEN build jobs above it. The cause was never
      # the build:
      #
      #   · Windows is dual-published by electron-builder, so it is on the
      #     feed the instant the release exists;
      #   · macOS and Linux are uploaded by CI to h2so4 ONLY — the mirror
      #     step in the release job is gated on RELEASES_REPO_TOKEN, which
      #     is not set on this repo, so it has been silently skipped;
      #   · the feed therefore fills from the feed-side timer instead, and
      #     that runs every 15 minutes. macOS finishes notarizing long after
      #     the last tick and never catches one before this job ran.
      #
      # So the gate was reporting "users cannot install this" when the truth
      # was "the mirror has not run yet" — a red X that had to be explained
      # away every release is a gate people stop believing.
      #
      # Dispatching costs one API call and turns a 15-minute wait into
      # seconds. It needs a PAT with `actions: write` + `contents: write` on
      # the feed repo, stored here as RELEASES_REPO_TOKEN. Without it this
      # step is skipped and the verify below simply waits out the timer
      # instead — slower, still correct, never a false red.
      - name: Ask the update feed to mirror this release now
        if: env.FEED_TOKEN != ''
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${FEED_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/madhavvan/interviewcopilot-releases/actions/workflows/mirror-from-source.yml/dispatches" \
            -d '{"ref":"main"}') || code=000
          if [ "$code" = "204" ]; then
            echo "::notice::Mirror dispatched on the feed repo; giving it a head start before verifying."
            sleep 45
          else
            # NOT a failure. The verifier below is the real gate, and it can
            # still pass off the scheduled mirror. Failing here would turn a
            # token problem into a red release.
            echo "::warning title=Could not dispatch the feed mirror::HTTP $code — falling back to the 15-minute scheduled mirror. Check that RELEASES_REPO_TOKEN has actions:write on madhavvan/interviewcopilot-releases."
            cat /tmp/dispatch.json || true
          fi

      # No `npm ci` — the verifier is dependency-free by design (node:
      # built-ins plus fetch) precisely so this gate cannot be broken by
      # an install failure.
      #
      # ⚠️ The retry budget must outlast the feed's 15-minute mirror cron,
      # or this fails for a release that was only ever a few minutes early.
      # 20 x 60s = 20 minutes covers a full tick plus CDN propagation. It
      # costs nothing when the dispatch above worked: the verifier returns
      # on its first success and does not sleep out the remainder.
      - name: Verify every feed serves ${{ github.event.release.tag_name }}
        id: feed
        run: node scripts/verify-release-feed.mjs --tag "${{ github.event.release.tag_name }}" --retries 20 --retry-wait 60

      # ── IS THE MAC BUILD OPENABLE, NOT JUST DOWNLOADABLE? ──
      #
      # The step above proves the feed SERVES the mac files. It cannot tell
      # whether they will open: an unsigned or un-stapled .app downloads with
      # a perfect 200 and then dies at Gatekeeper with "Apple could not
      # verify this app". To the user that is indistinguishable from the app
      # being broken.
      #
      # This check existed once as `mac-verify.yml` — a ONE-OFF for v4.0.8,
      # deleted the moment it passed (4170789, then 0ca1ecc). Thirteen
      # releases shipped afterwards with nobody checking. It is permanent now.
      #
      # Needs no macOS runner: it reads the ZIP central directory over HTTP
      # Range (a few hundred KB, not 2 x 176 MB) and asserts the signature
      # manifests plus the stapled ticket's 's8ch' magic. Dependency-free, so
      # a broken install cannot disable it.
      - name: Verify the macOS build is signed and stapled
        id: macsign
        run: node scripts/verify-mac-signing.mjs --tag "${{ github.event.release.tag_name }}"

      # Scoped to its OWN step. Both explainers used to be a bare `failure()`,
      # which fires them BOTH on either failure — two contradictory diagnoses
      # for one problem is worse than none.
      - name: Explain a macOS signing failure
        if: failure() && steps.macsign.outcome == 'failure'
        run: |
          echo "::error title=macOS build will not open::The feed serves the mac files, but they are not correctly signed or not stapled."
          echo ""
          echo "Stapling is what lets the app launch with NO network. An app that"
          echo "is notarized but un-stapled works on your machine (which has already"
          echo "talked to Apple) and fails on a candidate's — mid-interview."
          echo ""
          echo "Check, in order:"
          echo "  1. did the mac matrix job actually notarize? (notarize: true in"
          echo "     package.json makes electron-builder FAIL the build if not)"
          echo "  2. APPLE_API_KEY_ID / APPLE_API_ISSUER / APPLE_API_KEY_P8 valid?"
          echo "  3. did the mirror copy a TRUNCATED asset to the feed repo?"
          echo "     -> re-run: npm run release:mirror -- ${{ github.event.release.tag_name }}"
          echo ""
          echo "Reproduce locally (no Mac needed):"
          echo "  npm run release:verify-mac -- --tag ${{ github.event.release.tag_name }}"

      - name: Explain what a failure here means
        if: failure() && steps.feed.outcome == 'failure'
        run: |
          echo "::error title=Release is not reachable by users::The build succeeded but the update feed does not serve ${{ github.event.release.tag_name }}."
          echo ""
          echo "Installed apps read the FIRST entry of build.publish in package.json."
          echo "If that feed cannot serve the release, every existing install stays"
          echo "on its current version forever and cannot self-heal — the feed URL"
          echo "is baked into each installation at build time."
          echo ""
          echo "This job now DISPATCHES the feed mirror first and waits up to 20"
          echo "minutes, which is longer than the feed's 15-minute cron. So this"
          echo "is no longer 'the mirror just has not run yet' — something is"
          echo "actually wrong."
          echo ""
          echo "Most likely causes, in order:"
          echo "  1. RELEASES_REPO_TOKEN is missing or lacks actions:write +"
          echo "     contents:write on madhavvan/interviewcopilot-releases, AND"
          echo "     the scheduled mirror also failed"
          echo "     -> fix: npm run release:mirror -- ${{ github.event.release.tag_name }}"
          echo "  2. the feed repo does not exist, or is private"
          echo "  3. the release is still a draft (drafts are invisible to the feed)"
          echo "  4. a platform's channel file (latest-mac.yml / latest-linux.yml)"
          echo "     never reached the feed repo"
          echo ""
          echo "Re-run this job after fixing; it is safe to run any number of times."

      # ── A RED X IS NOT A FIX ──
      #
      # This gate has failed on real releases and the release stayed
      # "latest" regardless, because a failing check does not change
      # anything GitHub serves. v4.0.22 sat broken for two hours with this
      # job already red.
      #
      # So failure now DEMOTES: prerelease on both repos puts GitHub's
      # `latest` pointer back on the previous good release, which is what
      # routes/downloads.js and electron-updater both follow. Re-running
      # this job after fixing the feed is safe; promoting back is a
      # deliberate `gh release edit --prerelease=false --latest`.
      #
      # Deliberately NOT `always()` — this must fire on failure only.
      - name: Demote the release when the feed cannot serve it
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -uo pipefail
          echo "::error title=Feed cannot serve ${TAG}::Demoting to prerelease so downloads and auto-update fall back to the previous release."
          curl -sS -X PATCH -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -d '{"prerelease":true}' -o /dev/null || true
          if [ -n "${FEED_TOKEN}" ]; then
            fid=$(curl -sS -H "Authorization: Bearer ${FEED_TOKEN}" \
              "https://api.github.com/repos/madhavvan/interviewcopilot-releases/releases/tags/${TAG}" \
              | sed -n 's/.*"id": *\([0-9]*\).*/\1/p' | head -1)
            if [ -n "${fid}" ]; then
              curl -sS -X PATCH -H "Authorization: Bearer ${FEED_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/madhavvan/interviewcopilot-releases/releases/${fid}" \
                -d '{"prerelease":true}' -o /dev/null || true
            fi
          else
            echo "::warning title=Feed repo NOT demoted::RELEASES_REPO_TOKEN is unset — ${TAG} is still 'latest' on the update feed. Demote it by hand."
          fi
