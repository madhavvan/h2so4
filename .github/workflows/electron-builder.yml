name: Build and Release Desktop App

# Trigger matrix:
#   release: created    — fires when a release is created in PUBLISHED state
#                         (the historical default for `gh release create` flows)
#   release: published  — fires when a draft release is flipped to published.
#                         electron-builder's GitHub publish path always creates
#                         the release as draft first, then we PATCH it to non-
#                         draft. Without this trigger, the workflow never ran
#                         for releases shipped via `npm run electron:publish`,
#                         so Mac/Linux artifacts never made it into those tags.
#   workflow_dispatch   — manual trigger from the Actions tab. Useful for
#                         backfilling missing artifacts on an existing release
#                         without cutting a new tag.
on:
  release:
    types: [created, published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Hard cap so a slow Apple notarization can't hang the build for hours.
    # A healthy notarized 2-arch build runs ~40-55 min; past this the job
    # fails cleanly instead of waiting on Apple's notary service forever.
    strategy:
      fail-fast: false
      matrix:
        include:
          # buildOnDispatch=false on Windows: we sign Windows locally via
          # Azure Trusted Signing (CI doesn't have AZURE_CLIENT_SECRET set),
          # so a CI rebuild would replace the signed .exe with an unsigned
          # one that triggers SmartScreen warnings. Skip Windows on manual
          # triggers; keep it on real release events so the first signed
          # build in a fresh CI setup with proper secrets still works.
          - os: windows-latest
            platform: --win
            buildOnDispatch: false
          - os: macos-latest
            platform: --mac
            buildOnDispatch: true
          - os: ubuntu-latest
            platform: --linux
            buildOnDispatch: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Decide if this matrix entry should build
        id: gate
        # Build only when matrix.buildOnDispatch=true. The prior gate also
        # ran on `release: *` events, which made the Windows job try to
        # build in CI on every release — but CI doesn't carry the Azure
        # Trusted Signing secrets (AZURE_CLIENT_SECRET / TENANT / CLIENT
        # IDs), so the signing step always failed and produced a red X
        # alongside the (already-uploaded, locally-signed) Windows .exe
        # in the release. Windows builds locally via `npm run electron:
        # publish` and is uploaded to the release before CI ever fires;
        # Mac and Linux are the platforms CI handles. If we ever wire
        # the Azure secrets into GitHub repo secrets, flip Windows'
        # buildOnDispatch to true to re-enable CI rebuilds for it.
        run: |
          if [ "${{ matrix.buildOnDispatch }}" = "true" ]; then
            echo "go=1" >> $GITHUB_OUTPUT
          else
            echo "go=0" >> $GITHUB_OUTPUT
            echo "::notice::Skipping ${{ matrix.os }} — locally-signed builds aren't rebuilt by CI."
          fi
        shell: bash

      - name: Checkout code
        if: steps.gate.outputs.go == '1'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.gate.outputs.go == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build deps
        if: steps.gate.outputs.go == '1' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Install dependencies
        if: steps.gate.outputs.go == '1'
        run: npm ci

      - name: Build Vite app
        if: steps.gate.outputs.go == '1'
        run: npm run build

      # macOS notarization uses an App Store Connect API key. The .p8 key
      # file is stored base64-encoded in the APPLE_API_KEY_P8 secret; decode
      # it onto the runner so APPLE_API_KEY can point at a real file path.
      - name: Write Apple API key (macOS notarization)
        if: steps.gate.outputs.go == '1' && runner.os == 'macOS'
        run: echo "${{ secrets.APPLE_API_KEY_P8 }}" | openssl base64 -d -A > "$RUNNER_TEMP/AuthKey.p8"
        shell: bash

      - name: Build Electron app (no publish — CI token can't reach the releases repo)
        # package.json's publish is now an ARRAY (interviewcopilot-releases
        # first, h2so4 second) so app-update.yml in every artifact points at
        # the public releases repo. The default GITHUB_TOKEN can only write
        # THIS repo, so `--publish always` would fail on the first (external)
        # publisher and lose the build. Build only; the softprops step below
        # attaches everything (including latest-*.yml) to the h2so4 release,
        # and the releases-repo copy is synced from there. NOTE: this makes
        # workflow_dispatch backfills upload nothing (softprops is gated to
        # release events) — backfill by re-publishing the release instead.
        if: steps.gate.outputs.go == '1'
        run: npx electron-builder ${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing — Developer ID Application cert as a base64
          # .p12 in CSC_LINK. Unused by the Linux build; the Windows job
          # doesn't run in CI (it's signed locally via Azure Trusted Signing).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization via App Store Connect API key.
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: List built files
        if: steps.gate.outputs.go == '1'
        run: ls -la dist-electron/
        shell: bash

      # Belt-and-suspenders: electron-builder's publish should already have
      # attached every relevant file (binary + blockmap + latest-*.yml) to
      # the release. softprops re-uploads anything missed without overwriting
      # successful uploads.
      - name: Upload any additional files to release
        uses: softprops/action-gh-release@v2
        if: steps.gate.outputs.go == '1' && github.event_name == 'release'
        with:
          files: |
            dist-electron/*.yml
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
