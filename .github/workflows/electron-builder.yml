name: Build and Release Desktop App

# Trigger matrix:
#   release: published  — the ONLY release trigger. GitHub emits `published`
#                         both when a draft flips to published (the
#                         electron-builder local-publish flow) and when a
#                         release is created directly in published state
#                         (`gh release create`), so the old additional
#                         `created` trigger only ever produced a DUPLICATE
#                         run — whose parallel upload step raced this one's
#                         (v4.0.12 lost latest-linux.yml to exactly that
#                         race) and doubled CI minutes per release.
#   workflow_dispatch   — manual trigger from the Actions tab. Note: with
#                         `--publish never`, dispatch runs upload nothing
#                         (the upload step is gated to release events) —
#                         backfill by re-publishing the release instead.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Hard cap so a slow Apple notarization can't hang the build for hours.
    # A healthy notarized 2-arch build runs ~40-55 min; past this the job
    # fails cleanly instead of waiting on Apple's notary service forever.
    strategy:
      fail-fast: false
      matrix:
        include:
          # buildOnDispatch=false on Windows: we sign Windows locally via
          # Azure Trusted Signing (CI doesn't have AZURE_CLIENT_SECRET set),
          # so a CI rebuild would replace the signed .exe with an unsigned
          # one that triggers SmartScreen warnings. Skip Windows on manual
          # triggers; keep it on real release events so the first signed
          # build in a fresh CI setup with proper secrets still works.
          - os: windows-latest
            platform: --win
            buildOnDispatch: false
          - os: macos-latest
            platform: --mac
            buildOnDispatch: true
          - os: ubuntu-latest
            platform: --linux
            buildOnDispatch: true

    runs-on: ${{ matrix.os }}

    # Job-level so the mirror step's `if:` can test it. A step's own `env:`
    # block is not reliably in scope for that step's own conditional, and a
    # secret cannot be referenced from an `if:` directly.
    env:
      FEED_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}

    steps:
      - name: Decide if this matrix entry should build
        id: gate
        # Build only when matrix.buildOnDispatch=true. The prior gate also
        # ran on `release: *` events, which made the Windows job try to
        # build in CI on every release — but CI doesn't carry the Azure
        # Trusted Signing secrets (AZURE_CLIENT_SECRET / TENANT / CLIENT
        # IDs), so the signing step always failed and produced a red X
        # alongside the (already-uploaded, locally-signed) Windows .exe
        # in the release. Windows builds locally via `npm run electron:
        # publish` and is uploaded to the release before CI ever fires;
        # Mac and Linux are the platforms CI handles. If we ever wire
        # the Azure secrets into GitHub repo secrets, flip Windows'
        # buildOnDispatch to true to re-enable CI rebuilds for it.
        run: |
          if [ "${{ matrix.buildOnDispatch }}" = "true" ]; then
            echo "go=1" >> $GITHUB_OUTPUT
          else
            echo "go=0" >> $GITHUB_OUTPUT
            echo "::notice::Skipping ${{ matrix.os }} — locally-signed builds aren't rebuilt by CI."
          fi
        shell: bash

      - name: Checkout code
        if: steps.gate.outputs.go == '1'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.gate.outputs.go == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build deps
        if: steps.gate.outputs.go == '1' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Install dependencies
        if: steps.gate.outputs.go == '1'
        run: npm ci

      - name: Build Vite app
        if: steps.gate.outputs.go == '1'
        run: npm run build

      # macOS notarization uses an App Store Connect API key. The .p8 key
      # file is stored base64-encoded in the APPLE_API_KEY_P8 secret; decode
      # it onto the runner so APPLE_API_KEY can point at a real file path.
      - name: Write Apple API key (macOS notarization)
        if: steps.gate.outputs.go == '1' && runner.os == 'macOS'
        run: echo "${{ secrets.APPLE_API_KEY_P8 }}" | openssl base64 -d -A > "$RUNNER_TEMP/AuthKey.p8"
        shell: bash

      - name: Build Electron app (no publish — assets are attached below)
        # package.json's publish names TWO targets, in this order:
        #   1. madhavvan/interviewcopilot-releases  ← baked into app-update.yml
        #   2. madhavvan/h2so4                      ← legacy feed for <=v4.0.9
        # Entry #1 is the one electron-builder writes into every artifact's
        # app-update.yml, so it is the feed the shipped fleet will phone home
        # to. That is why BOTH upload steps below must run: an artifact whose
        # channel file lands only on h2so4 is invisible to every client built
        # from this config.
        #
        # History worth keeping: v4.0.11-v4.0.16 listed interviewcopilot-
        # releases first while that repo did not exist AND with releaseType
        # `draft`, so every one of those builds shipped with a feed that 404s
        # on its first request — the entire fleet has been unable to auto-
        # update since 2026-07-18. Two rules fall out of that:
        #   - the #1 target must be a repo that EXISTS and is PUBLIC, and
        #   - releaseType must be `release`; drafts appear in neither
        #     releases.atom nor /releases/latest, so a draft feed is a dead
        #     feed even when the repo is real.
        # `npm run release:verify` asserts both against the live feed.
        #
        # NOTE: --publish never means workflow_dispatch backfills upload
        # nothing (both upload steps are gated to release events) — backfill
        # by re-publishing the release instead.
        if: steps.gate.outputs.go == '1'
        run: npx electron-builder ${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing — Developer ID Application cert as a base64
          # .p12 in CSC_LINK. Unused by the Linux build; the Windows job
          # doesn't run in CI (it's signed locally via Azure Trusted Signing).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization via App Store Connect API key.
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: List built files
        if: steps.gate.outputs.go == '1'
        run: ls -la dist-electron/
        shell: bash

      # Belt-and-suspenders: electron-builder's publish should already have
      # attached every relevant file (binary + blockmap + latest-*.yml) to
      # the release. softprops re-uploads anything missed without overwriting
      # successful uploads. This one targets the repo that fired the event
      # (h2so4) — it is the LEGACY feed, still read by <=v4.0.9 installs.
      - name: Upload additional files to the source-repo release (legacy feed)
        uses: softprops/action-gh-release@v2
        if: steps.gate.outputs.go == '1' && github.event_name == 'release'
        with:
          files: |
            dist-electron/*.yml
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # THE ONE THAT REACHES USERS. secrets.GITHUB_TOKEN is scoped to this
      # repo only, so the step above physically cannot write to the update-
      # feed repo — without this step, CI-built macOS and Linux artifacts
      # (and, critically, latest-mac.yml / latest-linux.yml) never reach the
      # feed that every shipped app-update.yml points at, and Mac/Linux users
      # stay stranded even though Windows works. Requires a PAT with
      # `contents: write` on madhavvan/interviewcopilot-releases, stored as
      # the RELEASES_REPO_TOKEN secret on THIS repo.
      #
      # Gated on the secret being present so a fork or a fresh clone without
      # the secret still completes the legacy upload instead of failing red.
      # If it is skipped, `npm run release:mirror -- <tag>` does the same job
      # from a workstation. Either way, `npm run release:verify` is what
      # proves the feed is actually serving before you call a release done.
      - name: Mirror artifacts to the update-feed repo (what users update from)
        uses: softprops/action-gh-release@v2
        if: steps.gate.outputs.go == '1' && github.event_name == 'release' && env.FEED_TOKEN != ''
        with:
          repository: madhavvan/interviewcopilot-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: false
          files: |
            dist-electron/*.yml
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.blockmap

  # ────────────────────────────────────────────────────────────────────
  #  THE GATE THAT WAS MISSING
  #
  #  Everything above can go green while the fleet sees nothing. That is
  #  not hypothetical — it is what happened to v4.0.11 through v4.0.16:
  #  each build succeeded, each release was tagged, and every installed
  #  app polled a feed repo that did not exist. Nobody found out from CI,
  #  because CI only ever asserted that the BUILD worked.
  #
  #  `release:verify` walks the four anonymous HTTP steps a shipped app
  #  actually performs — releases.atom, /releases/latest, the per-platform
  #  channel file, then a ranged GET of every asset it names — against
  #  every configured feed. It is the only check here that can tell the
  #  difference between "we published a release" and "users can install
  #  it".
  #
  #  It existed before this job did, as a manual step documented in a
  #  comment. A manual step is exactly the kind that stops happening, so
  #  it runs here instead.
  #
  #  needs: release — must not start until every matrix entry has
  #  uploaded, or it would fail on artifacts that are merely not there
  #  yet. Retries absorb GitHub's CDN propagation delay on top of that.
  # ────────────────────────────────────────────────────────────────────
  verify-feed:
    name: Verify the update feed actually serves this release
    needs: release
    # `always()` so a skipped Windows entry (buildOnDispatch=false) does
    # not skip the gate. A genuinely FAILED build still short-circuits:
    # there is nothing to verify, and a red feed report on top of a red
    # build only obscures the real cause.
    if: always() && github.event_name == 'release' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm ci` — the verifier is dependency-free by design (node:
      # built-ins plus fetch) precisely so this gate cannot be broken by
      # an install failure.
      - name: Verify every feed serves ${{ github.event.release.tag_name }}
        run: node scripts/verify-release-feed.mjs --tag "${{ github.event.release.tag_name }}" --retries 6 --retry-wait 30

      - name: Explain what a failure here means
        if: failure()
        run: |
          echo "::error title=Release is not reachable by users::The build succeeded but the update feed does not serve ${{ github.event.release.tag_name }}."
          echo ""
          echo "Installed apps read the FIRST entry of build.publish in package.json."
          echo "If that feed cannot serve the release, every existing install stays"
          echo "on its current version forever and cannot self-heal — the feed URL"
          echo "is baked into each installation at build time."
          echo ""
          echo "Most likely causes, in order:"
          echo "  1. the mirror step was skipped (RELEASES_REPO_TOKEN secret missing)"
          echo "     -> fix: npm run release:mirror -- ${{ github.event.release.tag_name }}"
          echo "  2. the feed repo does not exist, or is private"
          echo "  3. the release is still a draft (drafts are invisible to the feed)"
          echo "  4. a platform's channel file (latest-mac.yml / latest-linux.yml)"
          echo "     never reached the feed repo"
          echo ""
          echo "Re-run this job after fixing; it is safe to run any number of times."
